# ChenVoice 唤醒节点 — ESP32-S3 N16R8 + INMP441
# 接线（用户实际）: SD=GPIO10 WS=GPIO11 SCK=GPIO12, L/R->GND(左声道)
esphome:
  name: mic-debug
  friendly_name: 小宸唤醒节点1

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf   # micro_wake_word 必须 IDF（需要 PSRAM/esp-sr 风格内存管理）

# N16R8: 16MB flash / 8MB octal PSRAM
psram:
  mode: octal
  speed: 80MHz

logger:
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Xiaochen-Node1-Fallback"

captive_portal:

mqtt:
  broker: 192.168.124.150   # 香橙派 broker（极简 broker，板端已在跑）
  discovery: false
  log_topic: null

i2s_audio:
  - id: i2s_mic
    # INMP441 用户接线: SD=GPIO10, WS=GPIO11, SCK=GPIO12, L/R->GND
    i2s_lrclk_pin: GPIO12   # WS
    i2s_bclk_pin: GPIO11    # SCK/BCLK
    use_legacy: false

microphone:
  - platform: i2s_audio
    id: mic_in
    i2s_audio_id: i2s_mic
    i2s_din_pin: GPIO10     # SD (data in)
    sample_rate: 16000
    channel: left           # L/R->GND = 左声道
    adc_type: external
    pdm: false

micro_wake_word:
  models:
    - model: D:/esphome-xiaochen/xiaochen-debug.json
  microphone:
    microphone: mic_in
  on_wake_word_detected:
    - mqtt.publish:
        topic: chenvoice/wake
        payload: '{"device":"node1","wake_word":"xiaochen"}'
    - output.turn_on: led_status
    - delay: 500ms
    - output.turn_off: led_status

output:
  - platform: gpio
    id: led_status
    pin:
      number: GPIO2
      inverted: true
