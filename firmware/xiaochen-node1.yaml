# ChenVoice 唤醒节点 — ESP32-S3 N16R8 + INMP441
# 接线（用户实际）: SD=GPIO10 WS=GPIO11 SCK=GPIO12, L/R->GND(左声道)
esphome:
  name: xiaochen-node1
  friendly_name: 小宸唤醒节点1
  compile_process_limit: 2   # 内存吃紧，降并发防被系统杀
  includes:
    - node_audio.h
    - wozai_pcm.h   # 「我在」应答音 PCM（node_audio.h 内嵌 #include）
  on_boot:
    priority: -100  # 所有组件 setup 完成后再启动检测
    then:
      # 统一采集：cn_capture_task 读 I2S → mic 回调（mww 特征 + 干净缓存）。
      - lambda: 'chenvoice::clean_init();'
      - script.execute: boot_play
      - lambda: 'chenvoice::mww_start_owned();'

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf   # micro_wake_word 必须 IDF（需要 PSRAM/esp-sr 风格内存管理）

# N16R8: 16MB flash / 8MB octal PSRAM
psram:
  mode: octal
  speed: 80MHz

logger:
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Xiaochen-Node1-Fallback"

captive_portal:

http_request:
  id: http_cli

mqtt:
  id: mqtt_cli
  broker: 192.168.207.150   # 香橙派 broker（极简 broker，板端已在跑）
  discovery: false
  birth_message:
    topic: 'xiaochen-node1/status'
    payload: 'online'
  will_message:
    topic: 'xiaochen-node1/status'
    payload: 'online'
  log_topic: null
  on_message:
    # 录音/上传期间暂停唤醒检测：板上无 AEC，自己发出的声音会再触发。
    - topic: chenvoice/control/node1/stt/off
      then:
        - lambda: 'chenvoice::mww_stop_owned();'
    - topic: chenvoice/control/node1/stt/on
      then:
        - lambda: 'chenvoice::mww_start_owned();'
    # 采集诊断：0=统计 / 1=统计+喇叭按2倍把最近10s放出来 / 2=1+再跑一轮录音上传
    # 需先录一段：把缓存里的最近 10s 导出成 listen.wav（PC 上取 http://<node>:9890/fn/listen.wav）
    - topic: chenvoice/control/node1/dump
      then:
        - lambda: 'chenvoice::dump_clean();'
    # 采集诊断：0=统计最近10s / 1=统计+喇叭按2倍把最近10s放出来 / 2=1+再跑一轮录音上传
    - topic: chenvoice/control/node1/diag
      then:
        - lambda: 'chenvoice::diag(atoi(x.c_str()));'
    # 播放 PC 上的 WAV：payload 是 URL（16bit mono 8k/16k）
    - topic: chenvoice/control/node1/play
      then:
        - lambda: 'chenvoice::play_url(x);'
    # MQTT 分包音频（香橙派推 TTS）：begin{json} / chunk(base64) / end
    - topic: chenvoice/audio/node1/begin
      then:
        - lambda: |-
            int total = 0;
            sscanf(x.c_str(), "{\"sr\":%*d,\"total\":%d}", &total);
            if (total == 0) {  // 兼容无 sr 的 {"total":N}
              const char* p = strstr(x.c_str(), "total");
              if (p) total = atoi(p + 6);
            }
            chenvoice::mq_audio_begin(total);
    - topic: chenvoice/audio/node1/chunk
      then:
        - lambda: 'chenvoice::mq_audio_chunk(x);'
    - topic: chenvoice/audio/node1/end
      then:
        - lambda: 'chenvoice::mq_audio_end();'

i2s_audio:
  - id: i2s_mic
    # INMP441 用户接线: SD=GPIO10, WS=GPIO11, SCK=GPIO12, L/R->GND
    i2s_lrclk_pin: GPIO11   # WS
    i2s_bclk_pin: GPIO12    # SCK/BCLK
    use_legacy: false
  # 喇叭不用 ESPHome 的 speaker/i2s_spk 组件：它的状态机在主循环被占用时走不到
  # RUNNING。node_audio.h 自持 I2S_NUM_1 + GPIO6/7/5（MAX98357），删掉组件避免抢资源。

microphone:
  - platform: i2s_audio
    id: mic_in
    i2s_audio_id: i2s_mic
    i2s_din_pin: GPIO10     # SD (data in)
    sample_rate: 16000
    # INMP441 是 24bit 数据左对齐在 32bit 槽里；按 16bit 开会每两个采样丢一半。
    bits_per_sample: 32bit
    # 32bit 被当成 Q31 做直流校正会把真实幅度压在 0 附近，必须关。
    correct_dc_offset: false
    # L/R->GND 选左声道（LEFT slot）。2026-10-18 抓到的 100ms 原始帧全是 0，
    # 两个 slot 都空：说明这一路数据根本没出来，先试回 left 验证 slot 位置。
    channel: left
    # ESPHome 的 microphone 不支持 filters；常驻的满幅数字噪声由软件
    # 消除（非 16-bit PCM 的残留样本）放在 chenvoice 节点代码里做。
    adc_type: external
    pdm: false
    # 唯一读 I2S 的是 mww 的 mic_task；这里顺带拿同一份数据存录音缓存。
    on_data:
      - lambda: 'chenvoice::cn_sample_cb(x);'

# 喇叭（MAX98357）走 node_audio.h 裸 I2S（SPK_BCLK=6 / SPK_LRC=7 / SPK_DOUT=5）。

micro_wake_word:
  id: micro_wake_word_
  stop_after_detection: false
  models:
    - model: D:/esphome-xiaochen/xiaochen.json
  microphone:
    microphone: mic_in
  on_wake_word_detected:
    - script.execute: node_wake

# 主循环每轮补 listener（mww 停稳 ~2s 后）。停止检测走 MQTT stt/on；
# 断网时 listen_task 60s 后本地兜底恢复。板上无 AEC，录音/播放期间必须停检测。
interval:
  - interval: 100ms
    then:
      - lambda: 'chenvoice::cn_maintain();'

script:
  # 开机 8s 从香橙派(8899)拉的 WAV 在板上直接播放（MAX98357），不管 MQTT 通不通
  - id: boot_play
    mode: restart
    then:
      - delay: 8s
      - lambda: 'chenvoice::play_boot();'
  - id: node_wake
    then:
      # 唤醒即上报香橙派：屏显立刻「聆听中」（独立任务发 HTTP，不挡录音流程）
      - lambda: 'chenvoice::wake_ping();'
      - output.turn_on: led_status
      - delay: 500ms
      - output.turn_off: led_status
      # 唤醒后停检测（板上无 AEC），录 6s（静音 0.8s 提前收尾）发香橙派做 ASR+意图+TTS。
      # 录完由 listen_task 通过 MQTT 让香橙派发 stt/on 恢复检测（断网时 60s 兜底复位）。
      - lambda: 'chenvoice::mww_stop_owned();'
      # mww 停后没人读 I2S，eardrum 的 mic_task 也停了；先延迟再录，让缓存的"尾巴"
      # 只含唤醒后的声音（录音按新增样本截取）。
      - delay: 300ms
      - lambda: 'chenvoice::listen(6, 800);'

output:
  - platform: gpio
    id: led_status
    pin:
      number: GPIO2

