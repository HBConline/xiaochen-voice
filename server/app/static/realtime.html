<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SenseVoice 实时语音识别</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #0d1117;
  color: #c9d1d9;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 40px 20px;
}
.container {
  max-width: 700px;
  width: 100%;
}
h1 {
  font-size: 24px;
  font-weight: 600;
  color: #58a6ff;
  margin-bottom: 8px;
}
.subtitle {
  color: #8b949e;
  font-size: 14px;
  margin-bottom: 32px;
}
.status-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
  padding: 12px 16px;
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 8px;
}
.status-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #484f58;
}
.status-dot.connected { background: #3fb950; }
.status-dot.speaking { background: #f85149; animation: pulse 0.5s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.btn-row {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
}
button {
  padding: 12px 24px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  border: none;
  cursor: pointer;
  transition: background 0.2s;
}
.btn-start {
  background: #238636;
  color: #fff;
}
.btn-start:hover { background: #2ea043; }
.btn-start:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }
.btn-stop {
  background: #da3633;
  color: #fff;
}
.btn-stop:hover { background: #f85149; }
.btn-stop:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }
.result-box {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 12px;
  padding: 20px;
  min-height: 200px;
  margin-bottom: 16px;
}
.result-box h3 {
  font-size: 13px;
  color: #8b949e;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 12px;
}
#results {
  font-size: 16px;
  line-height: 1.8;
  color: #e6edf3;
}
.result-item {
  padding: 8px 0;
  border-bottom: 1px solid #21262d;
}
.result-item:last-child { border-bottom: none; }
.result-item .text { color: #e6edf3; }
.result-item .meta {
  font-size: 12px;
  color: #8b949e;
  margin-top: 4px;
}
.speaking-indicator {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: #f8514920;
  border: 1px solid #f85149;
  border-radius: 6px;
  margin-bottom: 16px;
  font-size: 14px;
  color: #f85149;
}
.speaking-indicator.active { display: flex; }
.wave-bars {
  display: flex;
  gap: 3px;
  height: 20px;
  align-items: center;
}
.wave-bar {
  width: 3px;
  background: #f85149;
  border-radius: 2px;
  animation: wave 0.5s infinite;
}
.wave-bar:nth-child(1) { height: 8px; animation-delay: 0s; }
.wave-bar:nth-child(2) { height: 14px; animation-delay: 0.1s; }
.wave-bar:nth-child(3) { height: 10px; animation-delay: 0.2s; }
.wave-bar:nth-child(4) { height: 16px; animation-delay: 0.3s; }
.wave-bar:nth-child(5) { height: 12px; animation-delay: 0.4s; }
@keyframes wave {
  0%, 100% { transform: scaleY(1); }
  50% { transform: scaleY(0.5); }
}
</style>
</head>
<body>
<div class="container">
  <h1>🎤 SenseVoice 实时识别</h1>
  <p class="subtitle">VAD + ASR — 说话自动检测，静音自动识别</p>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">未连接</span>
  </div>

  <div class="btn-row">
    <button class="btn-start" id="btnStart" onclick="startRecognition()">开始监听</button>
    <button class="btn-stop" id="btnStop" onclick="stopRecognition()" disabled>停止</button>
  </div>

  <div class="speaking-indicator" id="speakingIndicator">
    <div class="wave-bars">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>
    检测到语音...
  </div>

  <div style="border-top: 1px solid #30363d; padding-top: 24px; margin-bottom: 24px;">
    <h3 style="font-size: 13px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px;">文件识别</h3>
    <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;">
      <button onclick="loadTestWav('zh.wav')" style="background: #161b22; border: 1px solid #30363d; color: #c9d1d9; padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer;">zh.wav 中文</button>
      <button onclick="loadTestWav('en.wav')" style="background: #161b22; border: 1px solid #30363d; color: #c9d1d9; padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer;">en.wav English</button>
      <button onclick="loadTestWav('ja.wav')" style="background: #161b22; border: 1px solid #30363d; color: #c9d1d9; padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer;">ja.wav 日本語</button>
      <button onclick="loadTestWav('ko.wav')" style="background: #161b22; border: 1px solid #30363d; color: #c9d1d9; padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer;">ko.wav 한국어</button>
      <button onclick="loadTestWav('yue.wav')" style="background: #161b22; border: 1px solid #30363d; color: #c9d1d9; padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer;">yue.wav 粤语</button>
    </div>
    <div id="dropZone" style="border: 2px dashed #30363d; border-radius: 8px; padding: 24px; text-align: center; cursor: pointer; transition: border-color 0.2s;">
      <div style="font-size: 32px; margin-bottom: 8px;">📁</div>
      <p style="color: #8b949e; font-size: 13px;">拖拽音频文件到此处，或点击选择</p>
      <div id="fileInfo" style="color: #58a6ff; font-size: 14px; margin-top: 8px;"></div>
    </div>
    <input type="file" id="fileInput" accept="audio/*" style="display:none">
    <audio id="audioPlayer" controls style="width: 100%; margin-top: 12px; display: none; border-radius: 8px;"></audio>
    <div style="display: flex; gap: 12px; margin-top: 12px;">
      <select id="lang" style="padding: 8px 12px; border-radius: 6px; font-size: 13px; border: 1px solid #30363d; background: #161b22; color: #c9d1d9;">
        <option value="auto">自动检测</option>
        <option value="zh" selected>中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="yue">粤语</option>
      </select>
      <button id="btnRecognize" onclick="recognizeFile()" disabled style="background: #238636; color: #fff; border: none; padding: 8px 20px; border-radius: 6px; font-size: 13px; cursor: pointer;">识别文件</button>
    </div>
  </div>

  <div class="result-box">
    <h3>识别结果</h3>
    <div id="results">
      <div style="color: #484f58">点击"开始监听"后对着麦克风说话</div>
    </div>
  </div>
</div>

<script>
let ws = null;
let audioContext = null;
let mediaStream = null;
let processor = null;

const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const btnStart = document.getElementById('btnStart');
const btnStop = document.getElementById('btnStop');
const speakingIndicator = document.getElementById('speakingIndicator');
const results = document.getElementById('results');

function setStatus(text, connected = false, speaking = false) {
  statusText.textContent = text;
  statusDot.className = 'status-dot' + (connected ? ' connected' : '') + (speaking ? ' speaking' : '');
}

function addResult(text, duration) {
  if (results.querySelector('div[style]')) {
    results.innerHTML = '';
  }
  const item = document.createElement('div');
  item.className = 'result-item';
  item.innerHTML = `<div class="text">${text}</div><div class="meta">时长 ${duration}s</div>`;
  results.prepend(item);
}

async function startRecognition() {
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1 } });
  } catch (e) {
    alert('无法访问麦克风: ' + e.message);
    return;
  }

  audioContext = new AudioContext({ sampleRate: 16000 });
  const source = audioContext.createMediaStreamSource(mediaStream);
  processor = audioContext.createScriptProcessor(512, 1, 1);

  processor.onaudioprocess = (e) => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      const data = e.inputBuffer.getChannelData(0);
      ws.send(new Float32Array(data).buffer);
    }
  };

  source.connect(processor);
  processor.connect(audioContext.destination);

  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${protocol}//${location.host}/ws`);

  ws.onopen = () => {
    setStatus('已连接 — 等待语音', true);
    btnStart.disabled = true;
    btnStop.disabled = false;
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'speech_start') {
      speakingIndicator.classList.add('active');
      setStatus('正在说话...', true, true);
    } else if (msg.type === 'speech_end') {
      speakingIndicator.classList.remove('active');
      setStatus('已连接 — 等待语音', true);
    } else if (msg.type === 'result') {
      addResult(msg.text, msg.duration);
    }
  };

  ws.onclose = () => {
    setStatus('连接断开');
    cleanup();
  };

  ws.onerror = () => {
    setStatus('连接错误');
    cleanup();
  };
}

function stopRecognition() {
  if (ws) ws.close();
  cleanup();
}

function cleanup() {
  if (processor) { processor.disconnect(); processor = null; }
  if (audioContext) { audioContext.close(); audioContext = null; }
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
  ws = null;
  btnStart.disabled = false;
  btnStop.disabled = true;
  speakingIndicator.classList.remove('active');
  setStatus('未连接');
}

// File upload handling
let selectedFile = null;
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileInfo = document.getElementById('fileInfo');
const audioPlayer = document.getElementById('audioPlayer');
const btnRecognize = document.getElementById('btnRecognize');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = '#58a6ff'; });
dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#30363d'; });
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.style.borderColor = '#30363d';
  if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) setFile(fileInput.files[0]);
});

function setFile(file) {
  selectedFile = file;
  fileInfo.textContent = file.name;
  const url = URL.createObjectURL(file);
  audioPlayer.src = url;
  audioPlayer.style.display = 'block';
  btnRecognize.disabled = false;
}

async function loadTestWav(name) {
  const resp = await fetch('/test_wavs/' + name);
  const blob = await resp.blob();
  const file = new File([blob], name, { type: 'audio/wav' });
  setFile(file);
}

async function recognizeFile() {
  if (!selectedFile) return;

  btnRecognize.disabled = true;
  btnRecognize.textContent = '识别中...';

  const t0 = performance.now();
  try {
    const form = new FormData();
    form.append('audio', selectedFile);

    const resp = await fetch('/transcribe', { method: 'POST', body: form });
    const data = await resp.json();

    const elapsed = ((performance.now() - t0) / 1000).toFixed(1);

    if (data.error) {
      addResult('错误: ' + data.error, 0);
    } else {
      addResult(data.text, data.duration);
      // Show RTF in meta
      const rtf = (elapsed / data.duration).toFixed(2);
      addMeta(`耗时 ${elapsed}s | RTF ${rtf}`);
    }
  } catch (e) {
    addResult('请求失败: ' + e.message, 0);
  }

  btnRecognize.disabled = false;
  btnRecognize.textContent = '识别文件';
}

function addMeta(text) {
  if (results.querySelector('div[style]')) {
    results.innerHTML = '';
  }
  const meta = document.createElement('div');
  meta.className = 'result-item';
  meta.innerHTML = `<div class="meta">${text}</div>`;
  results.prepend(meta);
}
</script>
</body>
</html>
