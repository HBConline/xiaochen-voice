# xiaochen-ai SoftAP — 由 setup-softap.sh 用 AP_PASS 环境变量替换 __AP_PASS__ 后安装到 /etc/hostapd/hostapd.conf
interface=wlan0
driver=nl80211
ssid=xiaochen-ai
hw_mode=g
channel=6
wmm_enabled=0
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_passphrase=__AP_PASS__
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
