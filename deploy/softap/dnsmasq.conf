# xiaochen-ai DHCP — 安装到 /etc/dnsmasq.d/xiaochen.conf
# 子网 192.168.4.0/24：派=.1（wlan0 静态地址），节点=.10，继电器=.21-.24
interface=wlan0
bind-interfaces
domain=xiaochen.lan
local=/xiaochen.lan/
dhcp-range=192.168.4.50,192.168.4.150,255.255.255.0,12h
# MAC 固定地址（热点子网漂移的根治）
dhcp-host=58:bf:25:4d:0e:60,192.168.4.21,relay1
dhcp-host=58:bf:25:4c:62:81,192.168.4.22,relay2
dhcp-host=e8:68:e7:77:0b:da,192.168.4.23,curtain1
dhcp-host=ec:fa:bc:14:96:96,192.168.4.24,fan1
# 节点 MAC 待填（命令行查：串口/esphome 日志里 STA MAC，或路由器 DHCP 列表）
# dhcp-host=<NODE_MAC>,192.168.4.10,node1
